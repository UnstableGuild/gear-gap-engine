# Check the code. No build job -- this is a pure library (no image, no
# Dockerfile, nothing published to a registry), consumed by the other four
# services over a git+ssh pin, never pulled as a container.
#
# THIS REPO HAD NO CI AT ALL BEFORE THIS FILE, the only one of five without
# it. 83 test functions across several files, run by hand on every change
# until now -- ungated, not untested. Its own mistakes propagate silently:
# gear-gap-web, gear-gap-character, gear-gap-intent and gear-gap-reference
# all pin it, and nothing stopped a tag from moving with a real regression
# behind it.
#
# NO ENGINE_DEPLOY_KEY DANCE -- unlike its own consumers, this repo has no
# private dependency of its own to authorise. That ssh-agent/known_hosts
# setup belongs to the repos pinning a private dependency, not the
# dependency itself.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same reasoning as every consumer's own build.yaml: pinned explicitly so
# this job never runs with more than read access, regardless of the repo
# default.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy src
