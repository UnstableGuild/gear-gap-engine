# Check the code. No build job -- this is a pure library (no image, no
# Dockerfile, nothing published to a registry), consumed by the other four
# services over a git+https pin, never pulled as a container.
#
# THIS REPO HAD NO CI AT ALL BEFORE THIS FILE, the only one of five without
# it. 83 test functions across several files, run by hand on every change
# until now -- ungated, not untested. Its own mistakes propagate silently:
# gear-gap-web, gear-gap-character, gear-gap-intent and gear-gap-reference
# all pin it, and nothing stopped a tag from moving with a real regression
# behind it.
#
# NO ENGINE_DEPLOY_KEY DANCE -- unlike its own consumers, this repo has no
# private dependency of its own to authorise. That ssh-agent/known_hosts
# setup belongs to the repos pinning a private dependency, not the
# dependency itself.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same reasoning as every consumer's own build.yaml: pinned explicitly so
# this job never runs with more than read access, regardless of the repo
# default.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # `--locked` refuses to re-resolve: if pyproject.toml and uv.lock ever
      # disagree, this fails loudly instead of installing something nobody
      # reviewed. Every dependency here (pytest/ruff/mypy and their own
      # transitive deps) is hash-verified against uv.lock.
      - name: Install
        run: uv sync --extra dev --locked

      - name: Tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src
